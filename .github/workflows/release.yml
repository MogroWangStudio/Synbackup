name: Release

# 手动触发的发布流水线（Actions → Release → Run workflow）：
#
#   1. 读 main 分支 src-tauri/tauri.conf.json 的版本号
#   2. 版本为 x.x.x-betaN → 打 tag vx.x.x-betaN 并发布 Pre-Release
#      版本为纯 x.x.x   → 打 tag vx.x.x   并发布 Release 且标记 latest
#   3. 双平台构建后把产物上传进该 Release
#
# 幂等性：tag 已存在则跳过创建（不移动 tag），Release 已存在则把产物
# 塞进去（--clobber 覆盖同名文件）并按 tag 纠正渠道标记——手动预建的
# Release、上次发布中途失败的 Release，重跑本工作流即可补齐。
#
# 与 ci.yml 的关系：ci.yml 保留 tag-push 触发发布与填 tag 补发两条路。
# 本工作流用内置 GITHUB_TOKEN 推 tag，其产生的事件不会触发其他
# workflow（防止 ci.yml 的 tag 发布双跑）；用 PAT 在本地推 tag 的
# 旧路径仍然走 ci.yml。

on:
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false # 发布排队执行，不互相取消

permissions:
  contents: read

jobs:
  prepare:
    name: 确定版本与 tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # git push 打 tag
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel_flag: ${{ steps.version.outputs.channel_flag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 仅允许 main 分支触发
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::本工作流按 main 分支的版本号发布，请在 main 上运行（当前：${GITHUB_REF_NAME}）"
            exit 1
          fi

      - name: 读取版本号并判定渠道
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # 版本含预发布后缀（如 -beta1）→ Pre-Release；纯版本 → Release 且标记 latest
          if [[ "$version" == *-* ]]; then
            flag="--prerelease"
          else
            flag="--latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "channel_flag=${flag}" >> "$GITHUB_OUTPUT"

      - name: 校验 CHANGELOG 已有对应版本段
        run: |
          version="${{ steps.version.outputs.version }}"
          # index() 字符串匹配而非动态正则：awk -v 会吃掉 \[ 转义导致匹配错段（实测踩过）
          if ! awk -v header="## [${version}]" '
            index($0, header) == 1 { found = 1 }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 \"## [${version}]\" 版本段——发布说明以该段为准，请先补齐再发布"
            exit 1
          fi

      - name: 打 tag（已存在则跳过——补发语义）
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "tag ${TAG} 已存在，跳过创建——本次运行为补发 / 重发，构建将检出该 tag 的代码"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Synbackup ${VERSION}"
            # GITHUB_TOKEN 推送不会反触发 ci.yml 的 tag 发布，避免双跑
            git push origin "${TAG}"
          fi

  build-windows:
    name: Windows x64 便携版
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 恒定检出 tag：新建时 = main HEAD，已存在时 = 原 commit——产物与 tag 代码严格一致
          ref: ${{ needs.prepare.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 先做类型检查：编译错误在 ~1 分钟内暴露，不必等 release 全量编译（LTO）跑完
      - name: Rust 类型检查（快速失败）
        run: cargo check --all-targets --manifest-path src-tauri/Cargo.toml

      - name: 构建便携版（跳过安装包）
        run: npm run tauri build -- --no-bundle

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $exe = "src-tauri/target/release/synbackup.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem src-tauri/target/release -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $exe "artifacts/Synbackup-${{ needs.prepare.outputs.version }}-windows-x64.exe"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: Synbackup-${{ needs.prepare.outputs.version }}-windows-x64
          path: artifacts/*
          if-no-files-found: error

  build-macos:
    name: macOS arm64 DMG
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 DMG
        run: npm run tauri build -- --bundles dmg

      - name: 整理产物
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg \
            "artifacts/Synbackup-${{ needs.prepare.outputs.version }}-macos-arm64.dmg"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: Synbackup-${{ needs.prepare.outputs.version }}-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: 发布 Release / Pre-Release
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL_FLAG: ${{ needs.prepare.outputs.channel_flag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载全部构建产物
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: 提取 CHANGELOG 对应版本段作为发布说明
        run: |
          version="${RELEASE_TAG#v}"
          # index() 字符串匹配而非动态正则：awk -v 会吃掉 \[ 转义导致匹配错段（实测踩过）
          awk -v header="## [${version}]" '
            index($0, header) == 1 { flag = 1; next }
            /^## \[/ && flag { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG 中没有 ${version} 段落，改用 GitHub 自动生成说明" >&2
            echo "use_generate=1" >> "$GITHUB_ENV"
          fi

      - name: 发布（已存在则上传产物并纠正渠道标记）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Synbackup ${RELEASE_TAG#v}"
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            # 同 tag 的 Release 已存在（手动预建 / 上次中途失败）：不重建，
            # 只把产物塞进去（--clobber 覆盖同名文件），渠道标记以 tag 为准纠正
            gh release upload "${RELEASE_TAG}" artifacts/* --clobber
            gh release edit "${RELEASE_TAG}" "${CHANNEL_FLAG}"
          else
            if [ "${use_generate:-0}" = "1" ]; then
              gh release create "${RELEASE_TAG}" artifacts/* \
                --title "$TITLE" \
                "${CHANNEL_FLAG}" --generate-notes
            else
              gh release create "${RELEASE_TAG}" artifacts/* \
                --title "$TITLE" \
                "${CHANNEL_FLAG}" --notes-file release-notes.md
            fi
          fi

      - name: 发布结果摘要
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${CHANNEL_FLAG}" == *latest* ]]; then channel="stable（latest）"; else channel="pre-release"; fi
          {
            echo "## 发布完成"
            echo ""
            echo "- Tag: \`${RELEASE_TAG}\`（渠道：${channel}）"
            echo ""
            echo "### 产物"
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
