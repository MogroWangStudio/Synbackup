name: CI

on:
  push:
    # 所有分支的 push 照常构建验证；v* tag 的 push 额外触发发布（release job）
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "补发 / 重发的 tag（如 v0.4.0-beta1，留空则只构建验证）"
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 便携版
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # dispatch 补发时按输入的 tag 检出对应代码，其余场景检触发 ref
          ref: ${{ inputs.release_tag || github.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          Add-Content $env:GITHUB_OUTPUT "version=$version"

      - name: 安装前端依赖
        run: npm ci

      # 先做类型检查：编译错误在 ~1 分钟内暴露，不必等 release 全量编译（LTO）跑完
      - name: Rust 类型检查（快速失败）
        run: cargo check --all-targets --manifest-path src-tauri/Cargo.toml

      - name: 构建便携版（跳过安装包）
        run: npm run tauri build -- --no-bundle

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $exe = "src-tauri/target/release/synbackup.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem src-tauri/target/release -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $exe "artifacts/Synbackup-${{ steps.version.outputs.version }}-windows-x64.exe"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: Synbackup-${{ steps.version.outputs.version }}-windows-x64
          path: artifacts/*
          if-no-files-found: error

  build-macos:
    name: macOS arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 读取版本号
        id: version
        run: |
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 DMG
        run: npm run tauri build -- --bundles dmg

      - name: 整理产物
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg \
            "artifacts/Synbackup-${{ steps.version.outputs.version }}-macos-arm64.dmg"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: Synbackup-${{ steps.version.outputs.version }}-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: 发布 Release / Pre-Release
    # v* tag 的 push 触发发布；dispatch 填了 release_tag 时补发 / 重发该 tag。
    # 分支 push 与未填 tag 的手动触发只构建验证
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # 补发时是输入的 tag，tag push 时是触发的 ref 名
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 校验 tag 与版本号一致
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${RELEASE_TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${RELEASE_TAG} 与 src-tauri/tauri.conf.json 的 version（${version}）不一致"
            exit 1
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: 提取 CHANGELOG 对应版本段作为发布说明
        run: |
          version="${RELEASE_TAG#v}"
          # 用 index() 字符串匹配而非动态正则：版本号里的点号与 -v 的转义处理易出歧义
          awk -v header="## [${version}]" '
            index($0, header) == 1 { flag = 1; next }
            /^## \[/ && flag { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG 中没有 ${version} 段落，改用 GitHub 自动生成说明" >&2
            echo "use_generate=1" >> "$GITHUB_ENV"
          fi

      - name: 渠道判定（tag 含 "-" 即 Pre-Release）
        id: channel
        run: |
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布（已存在则上传产物并纠正渠道标记）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="同备 Synbackup ${RELEASE_TAG#v}"
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            # 同 tag 的 Release 已存在（如手动预建）：不重建，只把产物塞进去
            # （--clobber 覆盖同名文件），渠道标记以 tag 为准纠正——手动建时
            # 漏勾 pre-release 也会被纠回，稳定渠道才不会误收到测试版
            gh release upload "${RELEASE_TAG}" artifacts/* --clobber
            gh release edit "${RELEASE_TAG}" ${{ steps.channel.outputs.flag }}
          else
            if [ "${use_generate:-0}" = "1" ]; then
              gh release create "${RELEASE_TAG}" artifacts/* \
                --title "$TITLE" \
                ${{ steps.channel.outputs.flag }} --generate-notes
            else
              gh release create "${RELEASE_TAG}" artifacts/* \
                --title "$TITLE" \
                ${{ steps.channel.outputs.flag }} --notes-file release-notes.md
            fi
          fi
