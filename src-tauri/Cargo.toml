[package]
name = "synbackup"
version = "0.4.0-beta2"
description = "同备 Synbackup — USB 移动存储设备文件同步与备份"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "synbackup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
sysinfo = "0.33"
filetime = "0.2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
quick-xml = "0.37"

# 非 macOS 平台的系统通知（macOS 走 UNUserNotificationCenter，见 notify.rs）
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

# macOS 系统通知：UNUserNotificationCenter 现代绑定（请求授权 + 前台横幅）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSObject", "NSString", "NSNotification"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNUserNotificationCenter",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
block2 = "0.6"

# Windows 设备事件：隐藏消息窗口接收 WM_DEVICECHANGE（卷插入 / 移除）
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
